spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/store_dev
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.store: DEBUG
